default_config:

# A room with adjustable sensors for the test plants.
input_number:
  living_room_temperature:
    name: Living room temperature
    min: 0
    max: 40
    step: 0.5
    initial: 22
    unit_of_measurement: "°C"
  living_room_humidity:
    name: Living room humidity
    min: 0
    max: 100
    step: 1
    initial: 35
    unit_of_measurement: "%"

template:
  - sensor:
      - name: Living room temperature
        unique_id: e2e_living_room_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.living_room_temperature') }}"
      - name: Living room humidity
        unique_id: e2e_living_room_humidity
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ states('input_number.living_room_humidity') }}"
